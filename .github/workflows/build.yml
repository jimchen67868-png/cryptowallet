name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Installs Gradle 8.7 directly, so no gradlew/wrapper jar is needed
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Unit tests (key derivation, signing, transaction encoding)
        run: gradle testDebugUnitTest --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
        env:
          # Optional. Repository variable and secret; see proxy/README.md. Empty = bridge switched off.
          ACROSS_PROXY_URL: ${{ vars.ACROSS_PROXY_URL }}
          ACROSS_PROXY_TOKEN: ${{ secrets.ACROSS_PROXY_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
